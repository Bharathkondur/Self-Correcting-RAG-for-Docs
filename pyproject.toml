[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --cov=backend --cov-report=term-missing"

[tool.coverage.run]
branch = true
omit = ["backend/logging_config.py"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

